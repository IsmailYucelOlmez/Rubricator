name: Deploy static site to GitHub Pages

# The public web presence is a static site (site/): landing page, About,
# Contact, privacy policy, account deletion. There is no Flutter web build.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "site/**"
      - "web/icons/**"
      - "web/favicon.png"
      - ".github/workflows/deploy-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test site generator
        run: |
          deno lint site
          deno test --allow-read --allow-write --allow-env site/

      - name: Build site
        env:
          # Repository variables (Settings > Secrets and variables > Actions >
          # Variables). Leave both unset until a domain is chosen: the site then
          # builds for https://<owner>.github.io/<repo>. Once the domain is
          # connected, set SITE_DOMAIN (e.g. rubricator.site).
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          # Public values (the same ones the mobile app ships with): the project
          # URL and publishable key the Virgil page signs in and searches with.
          # Without them the page builds as "not available".
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$SITE_DOMAIN" ]; then
            export SITE_URL="https://${SITE_DOMAIN}"
          elif [[ "$REPO" == *.github.io ]]; then
            export SITE_URL="https://${REPO}"
          else
            export SITE_URL="https://${OWNER,,}.github.io/${REPO}"
          fi
          echo "SITE_URL=$SITE_URL"
          deno run --allow-read --allow-write --allow-env site/build.ts

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site/dist
          # Replace the whole branch: the old Flutter web build must not linger.
          keep_files: false
          force_orphan: true
