# https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
# Declared here, but NOT applied automatically -- `supabase config diff` showed
# this project's remote site_url was still the CLI's local-dev default
# (http://localhost:3000), which the "you're confirmed" page depends on being
# correct (see site/src/confirmed.ts). Deploy the site with the confirmation
# page live FIRST, then run `supabase config push` to apply these two values;
# `push` only touches what's declared here, everything else (OTP length, MFA,
# SMS...) is left alone. See xdocs/rls_audit.md, "Faz 4".
site_url = "https://rubricator.site"
additional_redirect_urls = ["https://rubricator.site/**"]

[functions.google-books]
# Anonymous + publishable-key clients send apikey only (see ApiService).
verify_jwt = false

[functions.rubricatorApi]
# Proxies FastAPI (semantic + document chat). API key comes from edge secrets.
# verify_jwt stays false because the apps use sb_publishable_* keys (not JWTs);
# the function verifies the user's session JWT itself, allow-lists routes,
# restricts CORS origins and enforces the Virgil quota server-side
# (see xdocs/rubricator_api_security.md).
verify_jwt = false

[functions.warm-genre-cache]
# Invoked by pg_cron with service role; no end-user JWT.
verify_jwt = false

[functions.scrape-tr-books]
# Invoked by pg_cron with service role; no end-user JWT.
verify_jwt = false
